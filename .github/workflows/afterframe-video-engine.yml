
name: AFTERFRAME VIDEO ENGINE

on:
  workflow_dispatch:
    inputs:
      scene_plan:
        description: "Paste the complete scene-plan.json content"
        required: true
        type: string

jobs:
  validate-video-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Validate scene plan
        env:
          SCENE_PLAN: ${{ inputs.scene_plan }}
        run: |
          set -euo pipefail

          printf '%s' "$SCENE_PLAN" > scene-plan.json

          echo "Checking AFTERFRAME scene plan..."

          jq -e '
            .total_duration_seconds == 59 and
            (.shots | length) == 10 and
            ([.shots[].duration_seconds] | add) == 59 and
            all(.shots[];
              .duration_seconds >= 4 and
              .duration_seconds <= 8
            ) and
            ([.shots[].start_second] ==
              ([0] + ([.shots[0:-1][] |
                .start_second + .duration_seconds]))
            )
          ' scene-plan.json > /dev/null

          echo "Scene plan validation successful!"

          jq '{
            episode_title,
            visual_style,
            total_duration_seconds,
            shots_count: (.shots | length),
            shots: [.shots[] | {
              shot_number,
              start_second,
              duration_seconds
            }]
          }' scene-plan.json > video-production-plan.json

          echo "Estimated generation cost: approximately 5 USD"
          echo "This is a dry run. No video generation was started."

      - name: Save production plan
        uses: actions/upload-artifact@v4
        with:
          name: afterframe-video-production-plan
          path: |
            scene-plan.json
            video-production-plan.json
          retention-days: 7

      - name: Send Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          TITLE=$(jq -r '.episode_title' scene-plan.json)

          MESSAGE="AFTERFRAME VIDEO ENGINE: Plan validated successfully. Episode: ${TITLE}. 10 shots, 59 seconds. Dry run only: no paid video generation."

          curl --fail-with-body -sS \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
