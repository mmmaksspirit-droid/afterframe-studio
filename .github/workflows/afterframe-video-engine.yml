
name: AFTERFRAME VIDEO ENGINE

on:
  workflow_dispatch:
    inputs:
      scene_plan:
        description: "Paste the complete scene-plan.json content"
        required: true
        type: string
      visual_approval:
        description: "Paste visual-approval.json. All 10 keyframes must be approved."
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-video-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare submitted files
        env:
          SCENE_PLAN: ${{ inputs.scene_plan }}
          VISUAL_APPROVAL: ${{ inputs.visual_approval }}
        run: |
          set -euo pipefail
          printf '%s' "$SCENE_PLAN" > scene-plan.json
          printf '%s' "$VISUAL_APPROVAL" > visual-approval.json
          python -m json.tool scene-plan.json > /dev/null
          python -m json.tool visual-approval.json > /dev/null

      - name: Validate visual approval
        run: python scripts/afterframe-approval-gate.py

      - name: Validate 59-second scene plan
        run: |
          set -euo pipefail
          jq -e '
            .total_duration_seconds == 59 and
            (.shots | length) == 10 and
            ([.shots[].duration_seconds] | add) == 59 and
            all(.shots[];
              .duration_seconds >= 4 and
              .duration_seconds <= 8
            ) and
            ([.shots[].start_second] ==
              ([0] + ([.shots[0:-1][] |
                .start_second + .duration_seconds]))
            )
          ' scene-plan.json > /dev/null

          jq '{
            episode_title,
            visual_style,
            total_duration_seconds,
            shots_count: (.shots | length),
            shots: [.shots[] | {
              shot_number,
              start_second,
              duration_seconds
            }]
          }' scene-plan.json > video-production-plan.json

          echo "Plan and visual approval validated."
          echo "DRY RUN ONLY — no video generation and no paid API calls."

      - name: Save production plan and approvals
        uses: actions/upload-artifact@v4
        with:
          name: afterframe-video-production-plan
          path: |
            scene-plan.json
            visual-approval.json
            video-production-plan.json
          retention-days: 7

      - name: Send Telegram confirmation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          TITLE=$(jq -r '.episode_title' scene-plan.json)
          MESSAGE="AFTERFRAME: plan validated; all 10 keyframes marked approved. Episode: ${TITLE}. 59 seconds. DRY RUN ONLY — no video generation."
          curl --fail-with-body -sS \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
