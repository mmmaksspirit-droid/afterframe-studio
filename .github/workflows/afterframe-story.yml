
name: AFTERFRAME Story Generator

on:
  workflow_dispatch:

jobs:
  create-story:
    runs-on: ubuntu-latest
    steps:
      - name: Generate story with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          cat > request.json <<'JSON'
          {
            "contents": [
              {
                "role": "user",
                "parts": [
                  {
                    "text": "Ты сценарист оригинальной анимационной антологии AFTERFRAME. Придумай одну совершенно оригинальную самостоятельную историю для вертикального видео ровно 59 секунд, формат 9:16. Напиши ответ на русском языке. Структура: название; жанр и визуальный стиль; краткая идея; полный текст спокойного закадрового рассказчика; затем 6 сцен с точным временем начала и конца, описанием изображения, движения камеры и звуковых эффектов. Все 6 сцен вместе должны занимать ровно 59 секунд, без пробелов и пересечений. История должна иметь сильное начало, развитие, неожиданный финал. Не используй известных персонажей, чужие франшизы и заимствованные сюжеты. Персонажи не говорят в кадре. Музыку пока не создавай. Не добавляй пояснений вне структуры."
                  }
                ]
              }
            ]
          }
          JSON

          HTTP_CODE=$(curl -sS -w "%{http_code}" \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json)

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Gemini HTTP error: $HTTP_CODE"
            cat response.json
            exit 1
          fi

          STORY=$(jq -r '[.candidates[]?.content.parts[]? | .text? // empty] | join("\n")' response.json)

          if [ -z "$STORY" ]; then
            echo "Gemini returned no story text"
            cat response.json
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🎬 AFTERFRAME — НОВАЯ ИСТОРИЯ

          ${STORY}"

          echo "Story generated and sent to Telegram."
