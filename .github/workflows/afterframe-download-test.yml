
name: AFTERFRAME Download Test

on:
  workflow_dispatch:

jobs:
  download-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create test MP4
        run: |
          set -euo pipefail

          echo "Installing FFmpeg..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "Creating test video..."

          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x252050:s=360x640:r=24" \
            -t 3 \
            -an \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            afterframe-test.mp4

          test -s afterframe-test.mp4

          echo "Test MP4 created successfully."
          ls -lh afterframe-test.mp4

      - name: Send video to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@afterframe-test.mp4" \
            -F "caption=AFTERFRAME: Free MP4 test successful!"

          echo "Telegram delivery completed."

      - name: Save MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: afterframe-download-test
          path: afterframe-test.mp4
          retention-days: 7
