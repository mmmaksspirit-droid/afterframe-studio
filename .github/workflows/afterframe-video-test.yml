
name: AFTERFRAME Video Test

on:
  workflow_dispatch:
    inputs:
      confirm_paid_generation:
        description: "I approve one paid video generation (~$0.50)"
        required: true
        type: boolean
        default: false

jobs:
  generate-video:
    if: ${{ inputs.confirm_paid_generation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate and immediately download video
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          set -euo pipefail

          echo "Starting AFTERFRAME video generation..."

          RESPONSE=$(curl --fail-with-body -sS -X POST \
            "https://api.replicate.com/v1/models/minimax/video-01/predictions" \
            -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: wait=60" \
            -d '{
              "input": {
                "prompt": "A cinematic animated short film scene. A mysterious futuristic city at night, glowing neon lights, gentle rain, atmospheric fog, a lone character walking through an empty street. Premium detailed animation, smooth camera movement, dramatic lighting. No dialogue, no subtitles, no text, no music.",
                "prompt_optimizer": true
              }
            }')

          echo "$RESPONSE" > prediction.json

          ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

          if [ -z "$ID" ]; then
            echo "ERROR: Prediction ID not found."
            jq '{detail, title, status}' prediction.json
            exit 1
          fi

          echo "Prediction ID: $ID"
          echo "Initial status: $STATUS"

          for i in {1..45}; do
            if [ "$STATUS" = "succeeded" ]; then
              break
            fi

            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "Generation failed."
              jq '{status, error}' prediction.json
              exit 1
            fi

            sleep 10

            RESPONSE=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
              "https://api.replicate.com/v1/predictions/$ID")

            echo "$RESPONSE" > prediction.json
            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')

            echo "Generation status: $STATUS"
          done

          if [ "$STATUS" != "succeeded" ]; then
            echo "ERROR: Generation timed out."
            exit 1
          fi

          echo "Generation succeeded!"

          VIDEO_URL=$(jq -r '
            def extract_url:
              if type == "string" then .
              elif type == "object" then
                (.url // .video.url // .video // empty)
              else empty end;

            .output as $o |
            if ($o | type) == "array" then
              ($o[0] | extract_url)
            elif ($o | type) == "object" then
              ($o | extract_url)
            elif ($o | type) == "string" then
              $o
            else empty end
          ' prediction.json)

          if [ -z "$VIDEO_URL" ] || [[ "$VIDEO_URL" != https://* ]]; then
            echo "ERROR: Video URL not found."
            echo "Replicate output:"
            jq '.output' prediction.json
            exit 1
          fi

          echo "Video URL received."
          echo "Downloading video immediately..."

          curl --fail-with-body -L -sS \
            "$VIDEO_URL" \
            -o afterframe-test.mp4

          if [ ! -s afterframe-test.mp4 ]; then
            echo "ERROR: MP4 is empty."
            exit 1
          fi

          echo "MP4 downloaded successfully."
          ls -lh afterframe-test.mp4

      - name: Send video to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          curl --fail-with-body -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "video=@afterframe-test.mp4" \
            -F "caption=AFTERFRAME: Video generated successfully!"

          echo "Video sent to Telegram."

      - name: Save video and prediction data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterframe-video-backup
          path: |
            afterframe-test.mp4
            prediction.json
          if-no-files-found: warn
          retention-days: 7
